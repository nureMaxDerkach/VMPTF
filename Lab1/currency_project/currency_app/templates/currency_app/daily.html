{% extends 'currency_app/base.html' %}
{% block content %}
<h2>Курси валют за {{ today }}</h2>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Назва</th>
                <th>Курс купівлі (грн)</th>
                <th>Курс продажу (грн)</th>
            </tr>
        </thead>
        <tbody>
            {% for currency in currencies %}
            <tr>
                <td style="font-weight: 600; color: var(--primary);">{{ currency.name }}</td>
                <td>{{ currency.buy_rate }}</td>
                <td>{{ currency.sell_rate }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="empty-row">Сьогодні записів немає</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
