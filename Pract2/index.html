<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відображення зображення</title>
</head>
<body>
    <h1>Завантаження зображення через fetch</h1>
    <div id="container"></div>

    <script>
        fetch('https://jsonplaceholder.typicode.com/photos/1')
            .then(response => response.json())
            .then(data => {
                const img = document.createElement('img');
                img.src = data.url.replace('via.placeholder.com', 'dummyimage.com');
                img.alt = data.title;
                img.width = 300;
                document.getElementById('container').appendChild(img);
            })
            .catch(error => console.error('Помилка:', error));
    </script>
</body>
</html>
